<section class="screen anim">
  <app-glass-card>
    <div class="control-room-content">
      <h1 class="control-room-title">Control Room</h1>
      <p class="control-room-text">
        Exporta la data consolidada en formato CSV para uso interno.
      </p>

      <div class="form-group">
        <label for="admin-username">Usuario</label>
        <input
          id="admin-username"
          type="text"
          [(ngModel)]="username"
          [disabled]="isLoading()"
          autocomplete="username"
          placeholder="Ingresa tu usuario"
        />
      </div>

      <div class="form-group">
        <label for="admin-password">Contraseña</label>
        <input
          id="admin-password"
          type="password"
          [(ngModel)]="password"
          [disabled]="isLoading()"
          autocomplete="current-password"
          placeholder="Ingresa tu contraseña"
        />
      </div>

      <p class="error-text" *ngIf="errorMessage()">{{ errorMessage() }}</p>

      <div class="btn-center">
        <button
          class="btn-primary"
          type="button"
          (click)="onDownloadCsv()"
          [disabled]="isLoading()"
        >
          {{ isLoading() ? 'Descargando CSV...' : 'Descargar CSV' }}
        </button>
      </div>
    </div>
  </app-glass-card>
</section>
